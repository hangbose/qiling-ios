workflows:
  qiling-testflight:
    name: Qiling - signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: qiling-appstore
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - qiling-appstore-v3
        certificates:
          - qiling-appstore-v3
      vars:
        BUNDLE_ID: com.hangbose.qiling
        APPLE_TEAM_ID: 2ZPUD5H6P8
    scripts:
      - name: Generate release project
        script: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID must be configured}"
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 Scripts/configure-release.py --bundle-id "$BUNDLE_ID" --team-id "$APPLE_TEAM_ID" --build-number "$((BUILD_NUMBER + 1))"
          mkdir -p Config
          bash Scripts/prepare-assets.sh
          xcodegen generate
      - name: Test and launch on iPhone Simulator
        script: bash Scripts/test-ios.sh
      - name: Apply distribution signing profiles
        script: |
          set -euo pipefail
          python3 Scripts/validate-profiles.py
          xcode-project use-profiles
      - name: Archive and export signed IPA
        script: xcode-project build-ipa --project Qiling.xcodeproj --scheme Qiling
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/xcodebuild.log
      - build/TestResults.xcresult
      - build/native-home.png
    publishing:
      app_store_connect:
        auth: integration
        # Upload to App Store Connect; do not request external beta review.
        # Assign the processed build to the internal group in App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false
