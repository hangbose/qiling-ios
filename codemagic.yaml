workflows:
  qiling-testflight-status:
    name: Qiling - TestFlight distribution status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: qiling-appstore
    scripts:
      - name: Read tester groups and the five most recent Apple builds
        script: ruby Scripts/testflight-status.rb
  qiling-testflight:
    name: Qiling - signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: qiling-appstore
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - qiling-appstore-v3
        certificates:
          - qiling-appstore-v3
      vars:
        BUNDLE_ID: com.hangbose.qiling
        APPLE_TEAM_ID: 2ZPUD5H6P8
    scripts:
      - name: Generate release project
        script: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID must be configured}"
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          latest=$(app-store-connect get-latest-testflight-build-number 6827530890 --platform IOS)
          [[ "$latest" =~ ^[0-9]+$ ]] || { echo "Expected a numeric TestFlight build number"; exit 1; }
          number=$(( (latest > BUILD_NUMBER ? latest : BUILD_NUMBER) + 1 ))
          echo "Preparing TestFlight build $number"
          python3 Scripts/configure-release.py --bundle-id "$BUNDLE_ID" --team-id "$APPLE_TEAM_ID" --build-number "$number"
          mkdir -p Config
          bash Scripts/prepare-assets.sh
          xcodegen generate
      - name: Test and launch on iPhone Simulator
        script: bash Scripts/test-ios.sh
      - name: Apply distribution signing profiles
        script: |
          set -euo pipefail
          python3 Scripts/validate-profiles.py
          xcode-project use-profiles
      - name: Archive and export signed IPA
        script: xcode-project build-ipa --project Qiling.xcodeproj --scheme Qiling
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/xcodebuild.log
      - build/TestResults.xcresult
      - build/native-*.png
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - 好友体验测试
          - 本人真机测试
        submit_to_app_store: false
