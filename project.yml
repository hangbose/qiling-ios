name: Qiling
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Qiling:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 栖灵
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthUpdateUsageDescription: 栖灵当前仅读取睡眠和锻炼记录，不向 Apple 健康写入数据。
        NSHealthShareUsageDescription: 栖灵读取睡眠和锻炼记录，自动为你的精灵结算成长；无需手动打卡。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Config/Qiling.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.example.Qiling]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Qiling
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  QilingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["*.cjs"]
    dependencies:
      - target: Qiling
schemes:
  Qiling:
    build:
      targets:
        Qiling: all
    test:
      targets: [QilingTests]
