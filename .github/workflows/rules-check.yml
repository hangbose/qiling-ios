name: Health and territory rules
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/Growth.swift'
      - 'Sources/HealthyRules.swift'
      - 'Sources/CampusRules.swift'
      - 'Tests/CampusAndHealthTests.swift'
      - 'Tests/GrowthTests.swift'
      - 'Scripts/test-rules.sh'
      - '.github/workflows/rules-check.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test pure Swift rules without an iPhone runtime
        run: bash Scripts/test-rules.sh
